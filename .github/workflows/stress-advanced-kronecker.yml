name: Stress advanced Kronecker generator

on:
  push:
    branches:
      - feature/generalized-raven-families-2-5

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generalized-raven-families-2-5
          fetch-depth: 0

      - name: Stress Kronecker across levels and seeds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'(function ravenMiniGrid\(.*?)(?=function makeMarkerGridPuzzle\()', html, re.S)
          if not m:
              raise SystemExit('Generator block not found')
          block = m.group(1)
          prelude = r'''
          function clone(value){return JSON.parse(JSON.stringify(value))}
          function mod(x,n){return(x%n+n)%n}
          function random(seed){let h=2166136261;for(const ch of String(seed)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
          function pick(r,a){return a[Math.floor(r()*a.length)]}
          function shuffle(r,a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
          function ordered(a){return[...a].sort((x,y)=>typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y)))}
          function answerVisualKey(figure){
           if(figure.kind==='mini-grid')return JSON.stringify(['mini-grid',figure.n||3,ordered(figure.cells||[]),figure.fill||'solid']);
           if(figure.kind==='point-hull')return JSON.stringify(['point-hull',figure.span||5,Boolean(figure.connect),sortPointArray(figure.points||[])]);
           if(figure.kind==='cartesian-axis')return JSON.stringify(['cartesian-axis',figure.axis,figure.span||5,ordered(figure.values||[])]);
           if(figure.kind==='cartesian-product')return JSON.stringify(['cartesian-product',figure.span||5,ordered(figure.xValues||[]),ordered(figure.yValues||[])]);
           return JSON.stringify(figure)
          }
          function uniqueAnswerOptions(r,values,solutionKey){
           const distinct=new Map();for(const tile of values){const key=answerVisualKey(tile);if(!distinct.has(key))distinct.set(key,tile)}
           const solution=distinct.get(solutionKey);if(!solution)throw new Error('solution missing');
           const distractors=shuffle(r,[...distinct.entries()].filter(([key])=>key!==solutionKey).map(([,tile])=>tile)).slice(0,7);
           if(distractors.length<7)throw new Error('not enough unique answers '+distractors.length);
           return shuffle(r,[solution,...distractors])
          }
          function referencePuzzle(kind,seed,level,family,cells,solution,mutations,badge,meta,explanations,hints,extra={}){
           const r=random('reference-puzzle-v1|'+kind+'|'+seed+'|'+level+'|'+family),solutionKey=answerVisualKey(solution),candidates=new Map([[solutionKey,solution]]);
           for(const mutation of mutations||[]){const tile=clone(solution);mutation(tile);const key=answerVisualKey(tile);if(key!==solutionKey)candidates.set(key,tile)}
           for(let attempt=0;candidates.size<8&&attempt<500;attempt++){const tile=clone(solution),mutation=mutations[Math.floor(r()*Math.max(1,mutations.length))];if(mutation)mutation(tile);const key=answerVisualKey(tile);if(key!==solutionKey)candidates.set(key,tile)}
           if(candidates.size<8)throw new Error('Unable to generate eight distinct reference answers; got '+candidates.size);
           const options=uniqueAnswerOptions(r,[...candidates.values()],solutionKey),answer=options.findIndex(tile=>answerVisualKey(tile)===solutionKey);
           return{type:kind,seed,level,family,cells,options,answer,badge,meta,explanations,hints,...extra}
          }
          '''
          test = r'''
          const perLevel=300,report=[];
          for(let level=1;level<=6;level++){
           let seam=0,shared=0,symDistance=0,densityA=0,densityB=0,resultDensity=0,maxSeam=0,minSeam=Infinity,advancedCount=0;
           for(let seed=0;seed<perLevel;seed++){
            const p=makeKroneckerProductPuzzle('stress-kronecker-'+level+'-'+seed,level,'kronecker-product');
            if(p.cells.length!==9)throw new Error('cells '+level+' '+seed);
            if(p.options.length!==8)throw new Error('options '+level+' '+seed);
            const keys=p.options.map(answerVisualKey),solutionKey=answerVisualKey(p.cells[8]);
            if(new Set(keys).size!==8)throw new Error('duplicate answers '+level+' '+seed);
            if(keys.filter(key=>key===solutionKey).length!==1||keys[p.answer]!==solutionKey)throw new Error('bad answer '+level+' '+seed);
            for(let row=0;row<3;row++){
             const A=p.cells[row*3],B=p.cells[row*3+1],C=p.cells[row*3+2],expected=kroneckerCells(A.n,A.cells,B.n,B.cells);
             if(C.n!==A.n*B.n||JSON.stringify(expected)!==JSON.stringify(C.cells))throw new Error('Kronecker mismatch '+level+' '+seed+' row '+row);
            }
            const g=p.generator||{};seam+=Number(g.seamScore)||0;shared+=Number(g.sharedSymmetries)||0;symDistance+=Number(g.symmetryDistance)||0;densityA+=Number(g.densityA)||0;densityB+=Number(g.densityB)||0;maxSeam=Math.max(maxSeam,Number(g.seamScore)||0);minSeam=Math.min(minSeam,Number(g.seamScore)||0);if(g.complexityMode==='merged-seams')advancedCount++;
            const C=p.cells[8];resultDensity+=C.cells.length/(C.n*C.n);
           }
           report.push({level,cases:perLevel,advancedCount,avgSeam:+(seam/perLevel).toFixed(2),minSeam,maxSeam,avgSharedSymmetries:+(shared/perLevel).toFixed(2),avgSymmetryDistance:+(symDistance/perLevel).toFixed(2),avgDensityA:+(densityA/perLevel).toFixed(3),avgDensityB:+(densityB/perLevel).toFixed(3),avgResultDensity:+(resultDensity/perLevel).toFixed(3)});
          }
          console.log('KRONECKER_STRESS_REPORT='+JSON.stringify(report));
          console.log('KRONECKER_STRESS_TOTAL='+(perLevel*6));
          '''
          Path('/tmp/kronecker-stress.js').write_text(prelude + '\n' + block + '\n' + test, encoding='utf-8')
          PY
          node /tmp/kronecker-stress.js

      - name: Confirm branch synchronization and calibration
        shell: bash
        run: |
          cmp --silent index.html blackwingmatrix.html
          grep -q 'software-version" content="1.31.1"' index.html
          grep -q "'kronecker-product':30" index.html
          grep -q "complexityMode:advanced?'merged-seams':'standard'" index.html
          test ! -f .github/workflows/patch-advanced-kronecker.yml

      - name: Remove temporary stress workflow
        shell: bash
        run: |
          rm .github/workflows/stress-advanced-kronecker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/stress-advanced-kronecker.yml
          git commit -m "Remove temporary Kronecker stress workflow"
          git push origin HEAD:feature/generalized-raven-families-2-5
