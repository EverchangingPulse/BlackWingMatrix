name: Export BlackWingMatrix feature file

on:
  push:
    branches:
      - feature/generalized-raven-families-2-5

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/generalized-raven-families-2-5

      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: blackwingmatrix-feature
          path: blackwingmatrix.html
          if-no-files-found: error
